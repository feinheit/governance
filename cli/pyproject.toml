[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=77",
]

[project]
name = "governance-cli"
version = "0.13.0"
description = "Governance CLI"
readme = "README.md"
license = "BSD-3-Clause"
authors = [
  { name = "Matthias Kestenholz", email = "mk@feinheit.ch" },
]
requires-python = ">=3.15"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
  "click",
  "pyyaml",
  "requests",
  "rich",
  "tomli-w",
]
scripts.gov = "gov:cli"

[tool.setuptools]
packages = [
  "gov",
]
