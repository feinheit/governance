{% extends "base.html" %}
{% load i18n %}
{% block title %}{{ title }} – {{ block.super }}{% endblock %}

{% block content %}
  {# The user documentation from docs/ (governance/help.py) #}
  {% if start %}
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb mb-1 small">
        <li class="breadcrumb-item"><a href="{{ start }}">{% translate "Help" %}</a></li>
      </ol>
    </nav>
  {% endif %}
  <div class="wb-page-header">
    <h1>{{ title }}</h1>
  </div>
  <article class="card">
    <div class="card-body wb-markdown wb-help">{{ html }}</div>
  </article>
{% endblock content %}
