{% load governance i18n %}
<li class="list-group-item wb-row">
  <div class="wb-row-main">
    <div>{% if item.link %}<a href="{{ item.link }}">{{ item }}</a>{% else %}{{ item }}{% endif %}</div>
    <div class="wb-row-meta">
      <span>{{ label }}</span>{% if item.other_role %}<a
          href="{{ item.other_role.get_absolute_url }}"
        >{{ item.other_role }}</a>{% endif %}
    </div>
  </div>
  {% if can_edit %}
    <div class="d-flex gap-1 flex-shrink-0">
      <a
        {% button_class can_edit title=_("Edit") %}
        href="{% url 'role_item' kind item.pk %}"
        data-modal
      >{% icon "pencil" %}<span class="visually-hidden">{% translate "Edit" %}</span></a>
      <a
        {% button_class can_edit "btn-destructive" title=_("Delete") %}
        href="{% url 'role_item_delete' kind item.pk %}"
        data-modal
      >{% icon "trash" %}<span class="visually-hidden">{% translate "Delete" %}</span></a>
    </div>
  {% endif %}
</li>
