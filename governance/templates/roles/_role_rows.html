{% load i18n %}
{% for role in roles %}
  <li class="list-group-item wb-row">
    <div class="wb-row-main">
      <div class="wb-row-heading">
        <a class="wb-row-title" href="{{ role.get_absolute_url }}">{{ role }}</a>
        {% if role.is_circle %}<span class="badge wb-tone-circle">{% translate "Circle" %}</span>{% endif %}
      </div>
      <div class="wb-row-meta"><span>{% include "roles/_holders.html" %}</span></div>
    </div>
  </li>
{% endfor %}
