{% load governance i18n %}
{# Moving an accountability or domain (text) of the role without JavaScript; with it, its handle drags it (frontend/sortable.js) #}
<form method="post" action="{% url 'text_move' role.pk kind text.pk %}" class="wb-no-js flex-shrink-0">
  {% csrf_token %}
  <button type="submit" name="direction" value="up" class="btn btn-sm btn-quiet" title="{% translate 'Move up' %}">
    {% icon "arrow-up" %}<span class="visually-hidden">{% translate 'Move up' %}</span>
  </button>
  <button type="submit" name="direction" value="down" class="btn btn-sm btn-quiet" title="{% translate 'Move down' %}">
    {% icon "arrow-down" %}<span class="visually-hidden">{% translate 'Move down' %}</span>
  </button>
</form>
