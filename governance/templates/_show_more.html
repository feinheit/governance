{% load i18n %}
{% if more %}
  {# On the bottom edge of the last entry shown, followed by the .wb-more entries; only with JavaScript #}
  <li class="wb-show-more">
    <button type="button" class="btn btn-sm" data-show-more>
      {% blocktranslate count more=more|length trimmed %}
        Show {{ more }} more
      {% plural %}
        Show {{ more }} more
      {% endblocktranslate %}
    </button>
  </li>
{% endif %}
